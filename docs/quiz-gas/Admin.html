<script>
var TOKEN = sessionStorage.getItem('quizAdminToken') || '';
var ADMIN = JSON.parse(sessionStorage.getItem('quizAdminInfo') || 'null');
var TAB = 'tetapan';
var QUIZZES = [];
var app = document.getElementById('app');

function call(fn,args,onOk,onErr){
  var fail=function(e){
    var msg=(e&&e.message)||String(e||'');
    if(/Sesi/i.test(msg)){ // sesi tamat → balik ke log masuk (bukan kosong)
      try{ sessionStorage.clear(); }catch(_){}
      TOKEN=''; ADMIN=null; renderLogin('Sesi tamat. Sila log masuk semula.'); return;
    }
    if(onErr) onErr(e); else setHTML('<div class="err">⚠ '+esc(msg||'Ralat')+'</div>');
  };
  google.script.run.withSuccessHandler(onOk).withFailureHandler(fail)[fn].apply(google.script.run,args);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setHTML(h){ app.innerHTML=h; }
function busy(m){ setHTML('<div style="text-align:center;padding:14px"><span class="spin"></span><div class="muted" style="margin-top:8px">'+(m||'Memuatkan…')+'</div></div>'); }

// ================= LOGIN =================
function renderLogin(msg){
  setHTML('<h2 class="ttl">Log Masuk Admin</h2>'+
    '<p class="sub">Guna ID & kata laluan admin daerah scoutnadi anda.</p>'+
    '<label>Email</label><input id="em" type="email" placeholder="admin@contoh.com">'+
    '<label>Kata Laluan</label><input id="pw" type="password" placeholder="••••••••">'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<button class="block" id="btn" onclick="doLogin()">Log Masuk</button>');
  var pw=document.getElementById('pw'); if(pw) pw.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
  if(!em||!pw){ renderLogin('Sila isi email & kata laluan.'); return; }
  document.getElementById('btn').textContent='Menyemak…';
  call('adminLogin',[em,pw],function(res){
    TOKEN=res.token; ADMIN=res; sessionStorage.setItem('quizAdminToken',TOKEN);
    sessionStorage.setItem('quizAdminInfo',JSON.stringify(res)); boot();
  },function(e){ renderLogin((e&&e.message)||'Log masuk gagal.'); });
}
function logout(){ TOKEN=''; ADMIN=null; sessionStorage.clear(); renderLogin(); }

// ================= SHELL =================
function boot(){
  busy();
  call('adminListQuizzes',[TOKEN],function(list){ QUIZZES=list||[]; renderShell(); },function(e){
    if(String(e&&e.message).indexOf('Sesi')>=0){ logout(); } else { renderShell(e&&e.message); }
  });
}
function renderShell(err){
  var bar='<div class="bar"><div class="who">👤 <b>'+esc(ADMIN?ADMIN.name:'Admin')+'</b> · '+esc(ADMIN?ADMIN.role:'')+'</div>'+
          '<button class="ghost sm" onclick="logout()">Log Keluar</button></div>'+
    '<div class="tabs">'+
    tabBtn('tetapan','⚙️ Kuiz')+tabBtn('soalan','📝 Soalan')+tabBtn('keputusan','📊 Keputusan')+tabBtn('ringkasan','🏫 Sekolah')+'</div>'+
    '<div class="card" id="panel">'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</div>';
  app.outerHTML='<div class="card" style="background:transparent;border:0;box-shadow:none;padding:0" id="app">'+bar+'</div>';
  app=document.getElementById('app');
  showTab(TAB);
}
function tabBtn(id,label){ return '<div class="tab'+(TAB===id?' on':'')+'" onclick="showTab(\''+id+'\')">'+label+'</div>'; }
function panel(){ return document.getElementById('panel'); }
function showTab(id){
  TAB=id;
  document.querySelectorAll('.tab').forEach(function(t){ t.className='tab'; });
  // tandai aktif
  var idx={tetapan:0,soalan:1,keputusan:2,ringkasan:3}[id];
  document.querySelectorAll('.tab')[idx].className='tab on';
  if(id==='tetapan') tabTetapan();
  else if(id==='soalan') tabSoalan();
  else if(id==='keputusan') tabKeputusan();
  else tabRingkasan();
}

// ================= TAB: TETAPAN =================
function tabTetapan(){
  var rows=QUIZZES.map(function(q){
    return '<tr><td><b>'+esc(q.quizId)+'</b><br><span class="muted">'+esc(q.namaProgram)+'</span></td>'+
      '<td>'+esc(q.badgeName)+'<br><span class="muted">'+esc(q.tahun)+'</span></td>'+
      '<td>'+esc(q.ambangLulus)+'% · '+esc(q.bilSoalan)+' soalan</td>'+
      '<td>'+(q.aktif?'<span class="pill ok">AKTIF</span>':'<span class="pill no">TIDAK</span>')+'</td>'+
      '<td><button class="ghost sm" onclick="editQuiz(\''+esc(q.quizId)+'\')">Edit</button></td></tr>';
  }).join('');
  panel().innerHTML='<h3 class="ttl">Kuiz / Program</h3><p class="sub">Tetapkan program, ambang lulus & template slip.</p>'+
    '<button class="sm" onclick="editQuiz()">+ Tambah Kuiz</button>'+
    '<table><tr><th>Kuiz</th><th>Program</th><th>Tetapan</th><th>Status</th><th></th></tr>'+
    (rows||'<tr><td colspan="5" class="muted">Belum ada kuiz.</td></tr>')+'</table>';
}
function editQuiz(quizId){
  var q=QUIZZES.filter(function(x){return x.quizId===quizId;})[0]||{ambangLulus:80,bilSoalan:10,verifyMethod:'ic_last4',aktif:true};
  var f=function(id,v){return esc(v==null?'':v);};
  panel().innerHTML='<h3 class="ttl">'+(quizId?'Edit Kuiz':'Kuiz Baharu')+'</h3>'+
    '<label>quizId (unik, cth: keris-perak-2026)</label><input id="f_quizId" '+(quizId?'disabled':'')+' value="'+f('',q.quizId)+'">'+
    '<label>Nama Program</label><input id="f_namaProgram" value="'+f('',q.namaProgram)+'">'+
    '<label>badgeName (sama dengan nama program di scoutnadi)</label><input id="f_badgeName" value="'+f('',q.badgeName)+'">'+
    '<div class="row"><div><label>Tahun</label><input id="f_tahun" value="'+f('',q.tahun)+'"></div>'+
    '<div><label>Ambang Lulus (%)</label><input id="f_ambangLulus" value="'+f('',q.ambangLulus)+'"></div>'+
    '<div><label>Bil. Soalan</label><input id="f_bilSoalan" value="'+f('',q.bilSoalan)+'"></div></div>'+
    '<div class="row"><div><label>Kaedah Sahkan</label><select id="f_verifyMethod">'+
      opt('ic_last4','4 digit akhir IC',q.verifyMethod)+opt('membership','No. Keahlian',q.verifyMethod)+opt('ic_full','IC penuh',q.verifyMethod)+'</select></div>'+
    '<div><label>Aktif?</label><select id="f_aktif">'+opt('true','Ya',String(q.aktif))+opt('false','Tidak',String(q.aktif))+'</select></div></div>'+
    '<label>ID Template Slip (Google Docs/Slides)</label><input id="f_slidesTemplateId" value="'+f('',q.slidesTemplateId)+'">'+
    '<div id="msg"></div>'+
    '<div class="row" style="margin-top:16px"><button onclick="saveQuiz()">Simpan</button>'+
    '<button class="ghost" onclick="showTab(\'tetapan\')">Batal</button></div>';
}
function saveQuiz(){
  var g=function(id){var el=document.getElementById('f_'+id);return el?el.value:'';};
  var q={quizId:g('quizId'),namaProgram:g('namaProgram'),badgeName:g('badgeName'),tahun:g('tahun'),
    ambangLulus:g('ambangLulus'),bilSoalan:g('bilSoalan'),verifyMethod:g('verifyMethod'),
    slidesTemplateId:g('slidesTemplateId'),aktif:g('aktif')==='true'};
  if(!q.quizId){ document.getElementById('msg').innerHTML='<div class="err">quizId diperlukan.</div>'; return; }
  document.getElementById('msg').innerHTML='<div class="muted">Menyimpan…</div>';
  call('adminSaveQuiz',[TOKEN,q],function(){ boot(); },function(e){ document.getElementById('msg').innerHTML='<div class="err">'+esc((e&&e.message)||'Gagal')+'</div>'; });
}

// ================= TAB: SOALAN =================
/* Mesej yang perlu bertahan melintasi satu lompatan skrin (cth selepas import
   disimpan, kerana showTab melukis semula panel dari kosong). */
var FLASH='';
function flash(txt){ FLASH=txt; }
function takeFlash(){ var f=FLASH; FLASH=''; return f?'<div class="ok">'+esc(f)+'</div>':''; }

function tabSoalan(){
  if(!QUIZZES.length){ panel().innerHTML='<p class="muted">Sila tambah kuiz dahulu di tab Kuiz.</p>'; return; }
  // Kekalkan kuiz yang sedang dipilih. Tanpa ini, kembali dari pratonton
  // melompat balik ke kuiz pertama sementara mesej berkata "5 soalan disimpan".
  var sel='<select id="qz" onchange="loadQ()">'+QUIZZES.map(function(q){
    var on=String(q.quizId)===String(_rememberedQuiz);
    return '<option value="'+esc(q.quizId)+'"'+(on?' selected':'')+'>'+esc(q.namaProgram||q.quizId)+'</option>';
  }).join('')+'</select>';
  panel().innerHTML='<h3 class="ttl">Soalan</h3>'+takeFlash()+'<label>Pilih Kuiz</label>'+sel+
    '<div class="row" style="margin-top:12px"><button class="sm" onclick="editQ()">+ Tambah Soalan</button>'+
    '<button class="sm ghost" onclick="importForm()">⬇ Import dari Google Form</button></div>'+
    '<div id="importbox"></div>'+
    '<div id="qlist"><div class="muted" style="margin-top:12px">Memuatkan…</div></div>';
  loadQ();
}
function curQuiz(){ var s=document.getElementById('qz'); return s?s.value:''; }
function loadQ(){
  var quizId=curQuiz();
  document.getElementById('qlist').innerHTML='<div class="muted" style="margin-top:12px">Memuatkan…</div>';
  call('adminListQuestions',[TOKEN,quizId],function(list){
    var rows=(list||[]).map(function(q,i){
      return '<tr><td>'+(i+1)+'</td><td>'+esc(q.soalan)+'<br><span class="muted">Jwp: '+esc(q.jawapan)+' · '+esc(q.markah)+' mkh</span></td>'+
        '<td>'+(q.aktif?'<span class="pill ok">ON</span>':'<span class="pill no">OFF</span>')+'</td>'+
        '<td><button class="ghost sm" onclick="editQ('+q.row+')">Edit</button> '+
        '<button class="danger sm" onclick="delQ('+q.row+',this)">Padam</button></td></tr>';
    }).join('');
    window._Q=list||[];
    document.getElementById('qlist').innerHTML='<table><tr><th>#</th><th>Soalan</th><th></th><th></th></tr>'+
      (rows||'<tr><td colspan="4" class="muted">Belum ada soalan.</td></tr>')+'</table>';
  });
}
function editQ(row){
  var quizId=curQuizRemembered(); // tangkap SEBELUM panel #qz hilang
  var q=(window._Q||[]).filter(function(x){return x.row===row;})[0]||{markah:1,aktif:true,jawapan:'A'};
  var f=function(v){return esc(v==null?'':v);};
  panel().innerHTML='<h3 class="ttl">'+(row?'Edit Soalan':'Soalan Baharu')+'</h3>'+
    '<input type="hidden" id="s_quizId" value="'+f(quizId)+'">'+
    '<label>Soalan</label><textarea id="s_soalan">'+f(q.soalan)+'</textarea>'+
    '<div class="row"><div><label>A</label><input id="s_A" value="'+f(q.A)+'"></div><div><label>B</label><input id="s_B" value="'+f(q.B)+'"></div></div>'+
    '<div class="row"><div><label>C</label><input id="s_C" value="'+f(q.C)+'"></div><div><label>D</label><input id="s_D" value="'+f(q.D)+'"></div></div>'+
    '<label>E (pilihan)</label><input id="s_E" value="'+f(q.E)+'">'+
    '<div class="row"><div><label>Jawapan Betul</label>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap;padding:8px 0">'+
      ['A','B','C','D','E'].map(function(L){
        var on = normKunci(q.jawapan).indexOf(L) >= 0;
        return '<label style="display:flex;align-items:center;gap:5px;font-weight:600;cursor:pointer">'+
               '<input type="checkbox" id="s_ans_'+L+'"'+(on?' checked':'')+'> '+L+'</label>';
      }).join('')+
      '</div><div class="muted">Tanda lebih daripada satu untuk soalan kotak semak.</div></div>'+
    '<div><label>Markah</label><input id="s_markah" value="'+f(q.markah||1)+'"></div>'+
    '<div><label>Aktif?</label><select id="s_aktif">'+opt('true','Ya',String(q.aktif))+opt('false','Tidak',String(q.aktif))+'</select></div></div>'+
    '<label>Gambar Soalan (pilihan)</label>'+
    '<input type="file" id="s_imgfile" accept="image/*" onchange="uploadImg(this)">'+
    '<div id="s_imgmsg" class="muted" style="margin-top:6px">Muat naik imej (PNG/JPG, max 3MB) — disimpan ke Drive automatik.</div>'+
    '<input id="s_gambar" value="'+f(q.gambar)+'" placeholder="URL imej (auto-isi selepas upload)" style="margin-top:8px">'+

    '<div class="row" style="margin-top:16px"><button onclick="saveQ()">Simpan</button><button class="ghost" onclick="showTab(\'soalan\')">Batal</button></div>';

/* Padanan klien kepada _normKunci di Quiz.gs — kekalkan kedua-duanya selari. */
function normKunci(v){
  var s=String(v==null?'':v).toUpperCase();
  var toks=/[^A-E]/.test(s.trim())
    ? s.split(/[^A-E]+/).filter(function(t){return t.length===1;})
    : s.trim().split('');
  var out=[],seen={};
  toks.forEach(function(L){ if(L&&!seen[L]){seen[L]=true;out.push(L);} });
  return out.sort();
}
function saveQ(){
  var g=function(id){var el=document.getElementById('s_'+id);return el?el.value:'';};
  var quizId=g('quizId')||curQuizRemembered();
  var ans=['A','B','C','D','E'].filter(function(L){
    var el=document.getElementById('s_ans_'+L); return el&&el.checked;
  }).join(',');
  var q={quizId:quizId,soalan:g('soalan'),A:g('A'),B:g('B'),C:g('C'),D:g('D'),E:g('E'),
    jawapan:ans,markah:g('markah'),aktif:g('aktif')==='true',gambar:g('gambar'),row:g('row')?parseInt(g('row'),10):0};
  if(!String(quizId).trim()){ document.getElementById('msg').innerHTML='<div class="err">Sila pilih kuiz dahulu (kembali ke tab Soalan).</div>'; return; }
  if(!q.soalan.trim()){ document.getElementById('msg').innerHTML='<div class="err">Soalan diperlukan.</div>'; return; }
  if(!ans){ document.getElementById('msg').innerHTML='<div class="err">Sila tanda sekurang-kurangnya satu jawapan betul.</div>'; return; }
  var kosong=ans.split(',').filter(function(L){ return !String(g(L)||'').trim(); });
  if(kosong.length){ document.getElementById('msg').innerHTML='<div class="err">Jawapan '+kosong.join(', ')+' ditanda betul tetapi teks pilihannya kosong.</div>'; return; }
  document.getElementById('msg').innerHTML='<div class="muted">Menyimpan…</div>';
  call('adminSaveQuestion',[TOKEN,q],function(){ showTab('soalan'); },function(e){ document.getElementById('msg').innerHTML='<div class="err">'+esc((e&&e.message)||'Gagal')+'</div>'; });
}
var _rememberedQuiz='';
function curQuizRemembered(){ var s=document.getElementById('qz'); if(s){_rememberedQuiz=s.value;} return _rememberedQuiz; }
function delQ(row, btn){
  // Pengesahan dua-klik (elak confirm() yang disekat sandbox GAS)
  if(btn && btn.getAttribute('data-armed')!=='1'){
    btn.setAttribute('data-armed','1'); btn.textContent='Sah padam?';
    setTimeout(function(){ if(btn){ btn.removeAttribute('data-armed'); btn.textContent='Padam'; } }, 3000);
    return;
  }
  call('adminDeleteQuestion',[TOKEN,row],function(){ loadQ(); });
}
function importForm(){
  curQuizRemembered();
  var box=document.getElementById('importbox'); if(!box) return;
  box.innerHTML='<div class="box"><label>URL / ID Google Form (kuiz aneka pilihan)</label>'+
    '<input id="formurl" placeholder="https://docs.google.com/forms/d/…">'+
    '<div id="impmsg" class="muted" style="margin-top:8px">Form mesti jenis <b>Kuiz</b> dengan kunci jawapan supaya jawapan betul terisi automatik. Anda akan lihat pratonton sebelum apa-apa disimpan.</div>'+
    '<div class="row" style="margin-top:12px"><button class="sm" onclick="doPreviewForm()">Pratonton</button>'+
    '<button class="sm ghost" onclick="document.getElementById(\'importbox\').innerHTML=\'\'">Batal</button></div></div>';
  var el=document.getElementById('formurl');
  if(el){ el.focus(); el.addEventListener('keydown',function(e){ if(e.key==='Enter') doPreviewForm(); }); }
}

// ---------- Pratonton import (dry-run: tiada apa ditulis sehingga Simpan) ----------
var PREV=null;   // { quizId, items:[…], ringkasan:{…} }

function doPreviewForm(){
  var el=document.getElementById('formurl'); var url=el?el.value.trim():'';
  var msg=document.getElementById('impmsg');
  if(!url){ if(msg){msg.className='err';msg.textContent='Sila tampal URL/ID Google Form.';} return; }
  if(!_rememberedQuiz){ if(msg){msg.className='err';msg.textContent='Sila pilih kuiz dahulu.';} return; }
  if(msg){ msg.className='muted'; msg.innerHTML='<span class="spin"></span> Membaca Form… (gambar mengambil masa)'; }
  call('adminPreviewFormImport',[TOKEN,url,_rememberedQuiz],function(res){
    PREV=res; renderPreview();
  },function(e){
    if(msg){ msg.className='err'; msg.textContent=(e&&e.message)||'Gagal membaca Form.'; }
  });
}

/* Teks amaran. Kod amaran datang dari server (ImportForm.gs) — kekalkan selari. */
var AMARAN_TEKS={
  'dipotong': function(it){ return 'Form ada '+it.jumlahPilihanAsal+' pilihan — pilihan ke-6 dan seterusnya dibuang, kerana tab Soalan hanya ada lajur A–E.'; },
  'kunci-dipotong': function(){ return 'Jawapan betulnya ialah pilihan ke-6 atau seterusnya, yang dibuang. Soalan ini masuk <b>tanpa kunci</b>.'; },
  'tiada-kunci': function(){ return 'Tiada kunci jawapan — Form ini bukan jenis <b>Kuiz</b>.'; },
  'kunci-separa': function(){ return 'Sebahagian jawapan betul jatuh pada pilihan yang dibuang. Kunci yang tersimpan <b>tidak lengkap</b>, jadi murid yang menjawab betul akan ditanda salah.'; },
  'kunci-tanpa-teks': function(){ return 'Kunci jawapan menunjuk pilihan yang teksnya kosong.'; },
  'pilihan-kurang': function(){ return 'Kurang daripada dua pilihan berteks.'; },
  'duplikat': function(it){ return it.duplikatRow<0
      ? 'Sama dengan soalan #'+(-it.duplikatRow)+' dalam import ini.'
      : 'Soalan serupa sudah wujud dalam kuiz ini (baris '+it.duplikatRow+' di Sheet).'; },
  'tiada-gambar': function(){ return 'Form ada gambar untuk soalan ini tetapi ia gagal disimpan.'; }
};
/* Amaran yang dipapar merah (soalan rosak, bukan sekadar diberi perhatian). */
var AMARAN_MERAH=['kunci-dipotong','tiada-kunci','kunci-tanpa-teks','pilihan-kurang','kunci-separa'];
/* Padanan AMARAN_MAUT di ImportForm.gs — kekalkan kedua-duanya selari. Ia
   menentukan tanda LALAI, bukan apa yang dibenarkan disimpan. 'duplikat' ada di
   sini walaupun soalannya boleh dijawab: menyimpannya menggandakan soalan. */
var AMARAN_MAUT=AMARAN_MERAH.concat(['duplikat']);
function tandaLalai(it){
  return !(it.amaran||[]).some(function(a){ return AMARAN_MAUT.indexOf(a)>=0; });
}

function renderPreview(){
  if(!PREV){ showTab('soalan'); return; }
  var r=PREV.ringkasan||{};
  var kad=(PREV.items||[]).map(previewCard).join('');
  var sepanduk = r.semuaTiadaKunci
    ? '<div class="banner">⚠ Form ini bukan jenis <b>Kuiz</b>, jadi tiada kunci jawapan langsung. '+
      'Anda boleh tetap menyimpan soalan-soalan ini dan mengisi jawapan kemudian di tab Soalan — '+
      'tetapi kuiz <b>tidak akan</b> memaparkan soalan tanpa jawapan kepada murid.</div>'
    : '';
  panel().innerHTML=
    '<h3 class="ttl">Pratonton Import</h3>'+
    '<p class="sub">Ke dalam kuiz <b>'+esc(PREV.quizId)+'</b>. Tiada apa-apa disimpan sehingga anda tekan Simpan.</p>'+
    '<div class="pbar">'+
      '<div class="cnt" id="pcnt"></div>'+
      '<div class="row">'+
        '<button class="sm ghost" onclick="markAll(true)">'+(r.semuaTiadaKunci?'Tanda semua':'Tanda yang selamat')+'</button>'+
        '<button class="sm ghost" onclick="markAll(false)">Buang tanda</button>'+
        '<button class="sm" id="pbtn" onclick="commitImport()"></button>'+
        '<button class="sm ghost" onclick="discardPreview()">Batal</button>'+
      '</div>'+
      '<div id="pmsg"></div>'+
    '</div>'+
    sepanduk+
    kad;
  updateBar();
}

function previewCard(it,i){
  var rosak = !it.boleh || it.amaran.indexOf('kunci-separa')>=0;
  var opts=(it.options||[]).map(function(o){
    var betul=(it.jawapan||[]).indexOf(o.key)>=0;
    return '<div class="opt'+(betul?' right':'')+'">'+
      '<span class="bx '+(it.multi?'sq':'ro')+'"></span>'+
      '<span class="lt">'+esc(o.key)+'.</span><span>'+esc(o.text)+'</span>'+
      (betul?'<span class="tick">✓</span>':'')+'</div>';
  }).join('');
  var amaran=(it.amaran||[]).map(function(kod){
    var f=AMARAN_TEKS[kod]; if(!f) return '';
    var merah=AMARAN_MERAH.indexOf(kod)>=0;
    return '<div class="warn'+(merah?' fatal':'')+'">⚠ '+f(it)+'</div>';
  }).join('');
  var nota = !it.boleh
    ? '<div class="warn fatal">Soalan ini <b>tidak akan keluar</b> dalam kuiz walaupun disimpan.</div>'
    : '';
  var gambar = it.gambarPapar
    ? '<img class="qi" src="'+esc(it.gambarPapar)+'" onerror="this.style.display=\'none\'">' : '';
  return '<div class="qcard'+(rosak?' bad':'')+'">'+
    '<div class="qn">'+(i+1)+' / '+PREV.items.length+'</div>'+
    gambar+
    '<div class="qt">'+esc(it.soalan)+'</div>'+
    opts+
    amaran+nota+
    '<label class="pick"><input type="checkbox" id="pk'+i+'" onchange="togglePick('+i+')"'+
      (it.ambil?' checked':'')+'> Ambil soalan ini</label>'+
  '</div>';
}

function togglePick(i){
  var el=document.getElementById('pk'+i);
  if(el&&PREV&&PREV.items[i]) PREV.items[i].ambil=el.checked;
  updateBar();
}
function markAll(on){
  if(!PREV) return;
  var semua=PREV.ringkasan&&PREV.ringkasan.semuaTiadaKunci;
  PREV.items.forEach(function(it){ it.ambil = on ? (semua ? true : tandaLalai(it)) : false; });
  renderPreview();
}
function updateBar(){
  if(!PREV) return;
  var n=0,rosak=0;
  PREV.items.forEach(function(it){ if(it.ambil) n++; if(!it.boleh) rosak++; });
  var c=document.getElementById('pcnt');
  if(c) c.innerHTML=n+' daripada '+PREV.items.length+' ditanda'+
    (rosak?' &nbsp;·&nbsp; <span style="color:var(--bad)">'+rosak+' tidak boleh dijawab</span>':'')+
    ((PREV.ringkasan&&PREV.ringkasan.bergambar)?' &nbsp;·&nbsp; '+PREV.ringkasan.bergambar+' bergambar':'');
  var b=document.getElementById('pbtn');
  if(b){ b.textContent=n?('Simpan '+n+' soalan'):'Tiada ditanda'; b.disabled=!n; b.style.opacity=n?'1':'.5'; }
}
function commitImport(){
  if(!PREV) return;
  var n=PREV.items.filter(function(it){ return it.ambil; }).length;
  if(!n) return;
  var msg=document.getElementById('pmsg');
  if(msg){ msg.className='muted'; msg.innerHTML='<span class="spin"></span> Menyimpan…'; }
  // gambarPapar (data URI) SENGAJA tidak dihantar balik — ia hanya untuk paparan
  // dan boleh mencecah berpuluh MB.
  var kirim=PREV.items.map(function(it){
    return { soalan:it.soalan, options:it.options, jawapan:it.jawapan,
             gambar:it.gambar, gambarFileId:it.gambarFileId, ambil:!!it.ambil };
  });
  call('adminCommitImport',[TOKEN,PREV.quizId,kirim],function(r){
    var buang=r.gambarDibuang?(' '+r.gambarDibuang+' gambar tak terpakai dibuang.'):'';
    PREV=null; flash('✔ '+r.ditulis+' soalan disimpan.'+buang); showTab('soalan');
  },function(e){
    if(msg){ msg.className='err'; msg.textContent=(e&&e.message)||'Gagal menyimpan.'; }
  });
}
function discardPreview(){
  var ids=((PREV&&PREV.items)||[]).map(function(it){ return it.gambarFileId; })
                                  .filter(function(x){ return !!x; });
  PREV=null;
  if(ids.length) call('adminDiscardPreview',[TOKEN,ids],function(){},function(){});
  flash('Import dibatalkan — tiada soalan disimpan.');
  showTab('soalan');
}

// ================= TAB: KEPUTUSAN =================
function tabKeputusan(){
  if(!QUIZZES.length){ panel().innerHTML='<p class="muted">Belum ada kuiz.</p>'; return; }
  var sel='<select id="rqz" onchange="loadR()">'+QUIZZES.map(function(q){return '<option value="'+esc(q.quizId)+'">'+esc(q.namaProgram||q.quizId)+'</option>';}).join('')+'</select>';
  panel().innerHTML='<h3 class="ttl">Keputusan Peserta</h3><label>Pilih Kuiz</label>'+sel+'<div id="rlist"><div class="muted" style="margin-top:12px">Memuatkan…</div></div>';
  loadR();
}
function loadR(){
  var quizId=document.getElementById('rqz').value;
  document.getElementById('rlist').innerHTML='<div class="muted" style="margin-top:12px">Memuatkan…</div>';
  call('adminGetResults',[TOKEN,quizId],function(list){
    var rows=(list||[]).map(function(r){
      return '<tr><td>'+esc(r.nama)+'<br><span class="muted">'+esc(r.schoolCode)+'</span></td>'+
        '<td>'+esc(r.bestScore)+'/'+esc(r.total)+'</td><td>'+esc(r.attempts)+'</td>'+
        '<td>'+(r.passed?'<span class="pill ok">LULUS</span>':'<span class="pill no">BELUM</span>')+'</td>'+
        '<td>'+esc(r.certNo||'')+(r.claimedAt?'<br><span class="muted">diclaim</span>':'')+'</td></tr>';
    }).join('');
    document.getElementById('rlist').innerHTML='<table><tr><th>Nama</th><th>Markah</th><th>Cubaan</th><th>Status</th><th>Slip</th></tr>'+
      (rows||'<tr><td colspan="5" class="muted">Belum ada keputusan.</td></tr>')+'</table>'+
      '<div class="muted" style="margin-top:8px">Jumlah: '+(list?list.length:0)+' peserta</div>';
  }, function(e){
    document.getElementById('rlist').innerHTML='<div class="err">⚠ '+esc((e&&e.message)||'Gagal memuat keputusan.')+'</div>';
  });
}

// ================= TAB: RINGKASAN SEKOLAH =================
function tabRingkasan(){
  if(!QUIZZES.length){ panel().innerHTML='<p class="muted">Belum ada kuiz.</p>'; return; }
  var sel='<select id="sqz" onchange="loadSummary()">'+QUIZZES.map(function(q){return '<option value="'+esc(q.quizId)+'">'+esc(q.namaProgram||q.quizId)+'</option>';}).join('')+'</select>';
  panel().innerHTML='<h3 class="ttl">Ringkasan Sekolah</h3>'+
    '<p class="sub">Sekolah mana sudah jawab, berapa orang jawab & lulus.</p>'+
    '<label>Pilih Kuiz</label>'+sel+
    '<div id="slist"><div class="muted" style="margin-top:12px">Memuatkan…</div></div>';
  loadSummary();
}
function loadSummary(){
  var quizId=document.getElementById('sqz').value;
  document.getElementById('slist').innerHTML='<div class="muted" style="margin-top:12px"><span class="spin"></span> Memuatkan…</div>';
  call('adminGetSchoolSummary',[TOKEN,quizId],function(res){
    window._SUM=res||{}; renderSummary();
  }, function(e){
    document.getElementById('slist').innerHTML='<div class="err">⚠ '+esc((e&&e.message)||'Gagal memuat ringkasan.')+'</div>';
  });
}
function renderSummary(){
  var res=window._SUM||{}, rows=res.rows||[], t=res.totals||{}, hasReg=t.hasRegistered;
  var totalBelum=0;
  var body=rows.map(function(r,i){
    var reg=(r.registered==null)?'—':r.registered;
    var pct=(r.answered>0 && r.registered)?' <span class="muted">('+Math.round(r.answered/r.registered*100)+'%)</span>':'';
    // Belum ambil = berdaftar − jawab (hanya jika ada data berdaftar)
    var belum=(typeof r.registered==='number')?Math.max(0, r.registered - r.answered):null;
    if(belum!=null) totalBelum+=belum;
    var belumCell = (belum==null) ? '—'
      : (belum===0 ? '<span class="pill ok">✓ 0</span>'
                   : '<b style="color:var(--bad)">'+belum+'</b>');
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.schoolName)+'<br><span class="muted">'+esc(r.schoolCode)+'</span></td>'+
      (hasReg?'<td>'+esc(reg)+'</td>':'')+
      '<td>'+esc(r.answered)+pct+'</td>'+
      (hasReg?'<td>'+belumCell+'</td>':'')+
      '<td><b style="color:var(--ok)">'+esc(r.passed)+'</b></td>'+
      '<td>'+(belum===0 ? '<span class="pill ok">✓ SEMUA</span>'
                        : (r.answered>0?'<span class="pill ok">✓ MULA</span>':'<span class="pill no">BELUM</span>'))+'</td>'+
      '<td><button class="ghost sm" onclick="showSchoolStudents(\''+esc(String(r.schoolCode).replace(/'/g,"\\'"))+'\')">Lihat murid</button></td></tr>';
  }).join('');
  var ringkas='<div class="muted" style="margin:10px 0;font-weight:600">'+
    '🏫 '+(t.schools||0)+' sekolah &nbsp;·&nbsp; ✓ '+(t.answeredSchools||0)+' sudah mula &nbsp;·&nbsp; ✍️ '+(t.answered||0)+' jawab &nbsp;·&nbsp; 🏅 '+(t.passed||0)+' lulus'+
    (hasReg?' &nbsp;·&nbsp; 👥 '+(t.registered||0)+' berdaftar &nbsp;·&nbsp; ⏳ '+totalBelum+' belum ambil':'')+'</div>';
  document.getElementById('slist').innerHTML=ringkas+
    '<table><tr><th>#</th><th>Sekolah</th>'+(hasReg?'<th>Daftar</th>':'')+'<th>Jawab</th>'+(hasReg?'<th>Belum Ambil</th>':'')+'<th>Lulus</th><th>Status</th><th></th></tr>'+
    (body||'<tr><td colspan="8" class="muted">Tiada data.</td></tr>')+'</table>'+
    (hasReg?'':'<div class="muted" style="margin-top:8px;font-size:.78rem">💡 Lajur "Daftar" & "Belum Ambil" muncul selepas endpoint Supabase dikemas kini (lihat arahan).</div>')+
    '<div id="schooldetail"></div>';
}
function showSchoolStudents(code){
  var row=((window._SUM&&window._SUM.rows)||[]).filter(function(r){ return String(r.schoolCode).trim()===String(code).trim(); })[0];
  var list=(row&&row.students)||[];
  var rows=list.map(function(r){
    return '<tr><td>'+esc(r.nama)+'</td><td>'+esc(r.bestScore)+'/'+esc(r.total)+'</td><td>'+esc(r.attempts)+'</td>'+
      '<td>'+(r.passed?'<span class="pill ok">LULUS</span>':'<span class="pill no">BELUM</span>')+'</td>'+
      '<td>'+esc(r.certNo||'')+(r.claimedAt?'<br><span class="muted">dah cetak</span>':'')+'</td></tr>';
  }).join('');
  var d=document.getElementById('schooldetail');
  d.innerHTML='<div class="box"><b>Murid dah jawab · '+esc((row&&row.schoolName)||code)+' ('+esc(code)+')</b>'+
    '<table><tr><th>Nama</th><th>Markah</th><th>Cubaan</th><th>Status</th><th>Slip</th></tr>'+
    (rows||'<tr><td colspan="5" class="muted">Belum ada murid dari sekolah ini menjawab.</td></tr>')+'</table></div>';
  d.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ---- Muat naik imej soalan ----
function uploadImg(input){
  var file = input.files && input.files[0]; if(!file) return;
  if(file.size > 3*1024*1024){ imgMsg('Imej terlalu besar (max 3MB).','err'); input.value=''; return; }
  imgMsg('<span class="spin"></span> Memuat naik…','muted');
  var reader = new FileReader();
  reader.onload = function(){
    var b64 = String(reader.result).split(',')[1];
    call('adminUploadImage',[TOKEN, b64, file.type, file.name], function(res){
      var g=document.getElementById('s_gambar'); if(g) g.value=res.url;
      var p=document.getElementById('s_imgprev'); if(p) p.innerHTML='<img src="'+esc(res.url)+'" style="max-width:100%;border-radius:10px;margin-top:8px">';
      imgMsg('✔ Imej dimuat naik & disimpan ke Drive.','ok');
    }, function(e){ imgMsg((e&&e.message)||'Gagal muat naik.','err'); });
  };
  reader.readAsDataURL(file);
}
function imgMsg(html,cls){ var m=document.getElementById('s_imgmsg'); if(m){ m.className=cls||'muted'; m.innerHTML=html; } }

// ================= util =================
function opt(v,label,cur){ return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(label)+'</option>'; }

// mula
if(TOKEN && ADMIN) boot(); else renderLogin();
</script>
