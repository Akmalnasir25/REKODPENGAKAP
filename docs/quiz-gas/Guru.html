<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semakan Guru — Kinta Utara</title>
  <style>
    :root{--c:#6d28d9;--c2:#4c1d95;--c3:#8b5cf6;--ok:#15803d;--bad:#dc2626;--ink:#1f1937;--soft:#6b7280;--line:#ece8fb;--ring:#ddd6fe}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
    body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
      background:radial-gradient(1200px 400px at 50% -120px,#ede9fe 0,rgba(237,233,254,0) 60%),linear-gradient(180deg,#faf9ff 0,#f3f0fd 100%);min-height:100vh}
    .wrap{max-width:820px;margin:0 auto;padding:18px 16px 50px}
    .brand{text-align:center;padding:6px 0 2px}
    .brand img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(76,29,149,.25))}
    .brand .org{margin-top:6px;font-weight:800;letter-spacing:.06em;font-size:.78rem;color:var(--c2)}
    .brand .loc{font-size:.72rem;color:var(--soft);margin-top:2px}
    .brand .tag{display:inline-block;margin-top:8px;background:#0f766e;color:#fff;font-size:.7rem;font-weight:800;padding:3px 12px;border-radius:999px;letter-spacing:.08em}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(76,29,149,.10);padding:22px;margin-top:16px}
    .ttl{font-size:1.1rem;margin:0 0 2px;color:var(--c2);font-weight:800}
    .sub{color:var(--soft);font-size:.84rem;margin:.2rem 0 1rem}
    label{display:block;font-weight:700;font-size:.78rem;margin:.8rem 0 .3rem;color:#3b3357}
    input,select{width:100%;padding:11px 13px;border:1.5px solid var(--ring);border-radius:11px;font-size:.98rem;background:#fff;font-family:inherit}
    input:focus,select:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
    button{border:0;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer;color:#fff;
      background:linear-gradient(180deg,var(--c3),var(--c));box-shadow:0 8px 18px rgba(109,40,217,.26);padding:12px 16px;transition:transform .06s}
    button:active{transform:translateY(1px)} button.block{width:100%;margin-top:16px}
    button.ghost{background:#f4f1fe;color:var(--c2);box-shadow:none;border:1.5px solid var(--ring)}
    button.sm{padding:7px 11px;font-size:.8rem;border-radius:9px}
    button.green{background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 8px 18px rgba(21,128,61,.25)}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:16px}
    .who{font-size:.82rem}.who b{color:var(--c2)}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.85rem}
    th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    th{color:var(--soft);font-size:.74rem;text-transform:uppercase;letter-spacing:.03em}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800}
    .pill.ok{background:#dcfce7;color:#166534}.pill.no{background:#fee2e2;color:#991b1b}
    .err{color:var(--bad);font-size:.84rem;margin-top:10px;font-weight:600}
    .muted{color:var(--soft);font-size:.84rem}
    .stat{display:flex;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
    .stat .b{flex:1;min-width:90px;background:#f7f4ff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
    .stat .b .n{font-size:1.3rem;font-weight:900;color:var(--c2)}.stat .b .l{font-size:.7rem;color:var(--soft)}
    .spin{width:22px;height:22px;border:3px solid var(--ring);border-top-color:var(--c);border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:middle}
    @keyframes s{to{transform:rotate(360deg)}}
    .back{text-align:center;margin-top:12px;font-size:.82rem}
    .back a{color:var(--soft);text-decoration:none;font-weight:700}
    .back a:hover{color:var(--c2);text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <? if (logoUrl) { ?><img src="<?= logoUrl ?>" onerror="this.style.display='none'"><? } ?>
      <div class="org">PERSEKUTUAN PENGAKAP MALAYSIA</div>
      <div class="loc">Negeri Perak · Daerah Kinta Utara</div>
      <div class="tag">SEMAKAN GURU</div>
    </div>
    <div class="back"><a href="<?= appUrl ?>">← Kembali ke Kuiz Pelajar</a></div>
    <div id="app" class="card"><div style="text-align:center"><span class="spin"></span></div></div>
  </div>

<script>
var TOKEN = sessionStorage.getItem('quizTeacherToken') || '';
var INFO = JSON.parse(sessionStorage.getItem('quizTeacherInfo') || 'null');
var QUIZZES = [];
var app = document.getElementById('app');

function call(fn,args,onOk,onErr){
  var fail=function(e){
    var msg=(e&&e.message)||String(e||'');
    if(/Sesi/i.test(msg)){ TOKEN=''; INFO=null; try{ sessionStorage.clear(); }catch(_){} renderLogin('Sesi tamat. Sila log masuk semula.'); return; }
    if(onErr) onErr(e); else setHTML('<div class="err">⚠ '+esc(msg||'Ralat')+'</div>');
  };
  google.script.run.withSuccessHandler(onOk).withFailureHandler(fail)[fn].apply(google.script.run,args);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setHTML(h){ app.innerHTML=h; }
function busy(m){ setHTML('<div style="text-align:center;padding:14px"><span class="spin"></span><div class="muted" style="margin-top:8px">'+(m||'Memuatkan…')+'</div></div>'); }

function renderLogin(msg){
  setHTML('<h2 class="ttl">Semakan Guru</h2>'+
    '<p class="sub">Log masuk guna akaun <b>sekolah</b> scoutnadi anda untuk lihat & cetak semula slip murid.</p>'+
    '<label>Email Sekolah</label><input id="em" type="email" placeholder="sekolah@contoh.com">'+
    '<label>Kata Laluan</label><input id="pw" type="password" placeholder="••••••••">'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<button class="block" id="btn" onclick="doLogin()">Log Masuk</button>');
  var pw=document.getElementById('pw'); if(pw) pw.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
}
function doLogin(){
  var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
  if(!em||!pw){ renderLogin('Sila isi email & kata laluan.'); return; }
  document.getElementById('btn').textContent='Menyemak…';
  call('teacherLogin',[em,pw],function(res){
    TOKEN=res.token; INFO=res; sessionStorage.setItem('quizTeacherToken',TOKEN);
    sessionStorage.setItem('quizTeacherInfo',JSON.stringify(res)); boot();
  },function(e){ renderLogin((e&&e.message)||'Log masuk gagal.'); });
}
function logout(){ TOKEN=''; INFO=null; sessionStorage.clear(); location.reload(); }

function boot(){
  busy();
  call('teacherListQuizzes',[TOKEN],function(list){ QUIZZES=list||[]; renderShell(); },function(e){
    if(String(e&&e.message).indexOf('Sesi')>=0){ logout(); } else { renderShell(e&&e.message); }
  });
}
function renderShell(err){
  var sel=QUIZZES.length? '<select id="qz" onchange="loadStudents()">'+QUIZZES.map(function(q){return '<option value="'+esc(q.quizId)+'">'+esc(q.namaProgram||q.quizId)+'</option>';}).join('')+'</select>' : '';
  app.outerHTML='<div style="padding:0" id="app">'+
    '<div class="bar"><div class="who">🏫 <b>'+esc(INFO?INFO.schoolName:'Sekolah')+'</b></div>'+
    '<button class="ghost sm" onclick="logout()">Log Keluar</button></div>'+
    '<div class="card">'+(err?'<div class="err">'+esc(err)+'</div>':'')+
    '<h3 class="ttl">Senarai Murid & Slip</h3>'+
    '<p class="sub">Cetak semula slip murid yang telah lulus.</p>'+
    (sel?('<label>Pilih Kuiz / Program</label>'+sel):'<p class="muted">Tiada kuiz tersedia.</p>')+
    '<div id="list"></div></div></div>';
  app=document.getElementById('app');
  if(QUIZZES.length) loadStudents();
}
function loadStudents(){
  var quizId=document.getElementById('qz').value;
  document.getElementById('list').innerHTML='<div class="muted" style="margin-top:12px">Memuatkan…</div>';
  call('teacherListStudents',[TOKEN,quizId],function(res){
    var list = Array.isArray(res) ? res : (res && res.students) || [];
    var notTaken = (res && res.notTaken) || [];
    var registered = (res && res.registered) || 0;
    var lulus=list.filter(function(r){return r.passed;}).length;
    var rows=list.map(function(r){
      var act = r.passed
        ? '<button class="green sm" onclick="reprint(\''+esc(r.quizId)+'\',\''+esc(r.participantId)+'\',this)">🖨️ Cetak Slip</button>'
        : '<span class="muted">—</span>';
      return '<tr><td>'+esc(r.nama)+'</td><td>'+esc(r.bestScore)+'/'+esc(r.total)+'</td>'+
        '<td>'+esc(r.attempts)+'</td>'+
        '<td>'+(r.passed?'<span class="pill ok">LULUS</span>':'<span class="pill no">BELUM</span>')+'</td>'+
        '<td>'+(r.claimedAt?'<span class="muted">sudah cetak</span>':(r.passed?'<span class="muted">belum cetak</span>':''))+'</td>'+
        '<td>'+act+'</td></tr>';
    }).join('');
    // Bahagian murid BELUM AMBIL ujian
    var belumSec='';
    if(registered>0 || notTaken.length){
      var belumRows=notTaken.map(function(p,i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(p.nama)+'</td></tr>'; }).join('');
      belumSec='<h3 class="ttl" style="margin-top:22px">⏳ Belum Ambil Ujian ('+notTaken.length+')</h3>'+
        (notTaken.length
          ? '<table><tr><th>#</th><th>Nama Murid</th></tr>'+belumRows+'</table>'
          : '<p class="muted">🎉 Semua murid berdaftar telah mengambil ujian.</p>');
    }
    document.getElementById('list').innerHTML=
      '<div class="stat"><div class="b"><div class="n">'+(registered||list.length)+'</div><div class="l">'+(registered?'Berdaftar':'Jumlah murid')+'</div></div>'+
      '<div class="b"><div class="n" style="color:var(--ok)">'+lulus+'</div><div class="l">Lulus</div></div>'+
      '<div class="b"><div class="n" style="color:var(--bad)">'+notTaken.length+'</div><div class="l">Belum ambil</div></div></div>'+
      '<h3 class="ttl">✍️ Dah Jawab ('+list.length+')</h3>'+
      '<table><tr><th>Nama</th><th>Markah</th><th>Cubaan</th><th>Status</th><th>Slip</th><th></th></tr>'+
      (rows||'<tr><td colspan="6" class="muted">Belum ada murid menjawab.</td></tr>')+'</table>'+
      belumSec;
  }, function(e){
    document.getElementById('list').innerHTML='<div class="err">⚠ '+esc((e&&e.message)||'Gagal memuat senarai.')+'</div>';
  });
}
function reprint(quizId, participantId, btn){
  if(btn){ btn.textContent='Menjana…'; btn.disabled=true; }
  call('teacherReprintCertificate',[TOKEN,quizId,participantId],function(c){
    downloadB64(c.dataB64,c.filename,c.mimeType);
    if(btn){ btn.textContent='🖨️ Cetak Slip'; btn.disabled=false; }
    loadStudents();
  },function(e){ alert((e&&e.message)||'Gagal jana slip'); if(btn){ btn.textContent='🖨️ Cetak Slip'; btn.disabled=false; } });
}
function downloadB64(b64,name,mime){
  var bytes=atob(b64), arr=new Uint8Array(bytes.length);
  for(var i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
  var blob=new Blob([arr],{type:mime||'application/pdf'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name||'slip.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
}

if(TOKEN && INFO) boot(); else renderLogin();
</script>
</body>
</html>
