<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuiz Pengakap — Kinta Utara</title>
  <style>
    :root{
      --c:#6d28d9; --c2:#4c1d95; --c3:#8b5cf6;
      --ok:#15803d; --bad:#dc2626; --ink:#1f1937; --soft:#6b7280;
      --line:#ece8fb; --ring:#ddd6fe;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0}
    body{
      font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
      background:
        radial-gradient(1200px 400px at 50% -120px,#ede9fe 0,rgba(237,233,254,0) 60%),
        linear-gradient(180deg,#faf9ff 0,#f3f0fd 100%);
      min-height:100vh;
    }
    .wrap{max-width:580px;margin:0 auto;padding:18px 16px 40px}

    .brand{text-align:center;padding:6px 0 2px}
    .brand img{width:78px;height:78px;object-fit:contain;
      filter:drop-shadow(0 4px 10px rgba(76,29,149,.25))}
    .brand .org{margin-top:8px;font-weight:800;letter-spacing:.06em;font-size:.82rem;color:var(--c2)}
    .brand .loc{font-size:.74rem;color:var(--soft);margin-top:2px;letter-spacing:.02em}
    .brand .rule{height:3px;width:64px;margin:12px auto 0;border-radius:999px;
      background:linear-gradient(90deg,var(--c3),var(--c))}

    .card{background:#fff;border:1px solid var(--line);border-radius:18px;
      box-shadow:0 12px 34px rgba(76,29,149,.10);padding:22px;margin-top:16px}
    .ttl{font-size:1.15rem;margin:0;color:var(--c2);font-weight:800}
    .sub{color:var(--soft);font-size:.85rem;margin:.25rem 0 1rem}

    label{display:block;font-weight:700;font-size:.82rem;margin:.9rem 0 .35rem;color:#3b3357}
    select,input{width:100%;padding:13px 14px;border:1.5px solid var(--ring);border-radius:12px;
      font-size:1rem;background:#fff;transition:border-color .15s,box-shadow .15s}
    select:focus,input:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px rgba(124,58,237,.12)}

    button{width:100%;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:1rem;
      margin-top:18px;cursor:pointer;color:#fff;
      background:linear-gradient(180deg,var(--c3),var(--c));
      box-shadow:0 8px 18px rgba(109,40,217,.28);transition:transform .06s,box-shadow .15s,opacity .15s}
    button:hover{box-shadow:0 10px 22px rgba(109,40,217,.34)}
    button:active{transform:translateY(1px)}
    button:disabled{background:#c4b5fd;box-shadow:none;cursor:not-allowed}
    button.ghost{background:#f4f1fe;color:var(--c2);box-shadow:none;border:1.5px solid var(--ring)}

    .q{padding:16px 0;border-bottom:1px solid var(--line)}
    .q:last-of-type{border-bottom:0}
    .q .t{font-weight:700;margin-bottom:12px;line-height:1.45}
    .q .t .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
      border-radius:50%;background:#ede9fe;color:var(--c2);font-size:.8rem;margin-right:8px;vertical-align:middle}
    .qimg{display:block;max-width:100%;border-radius:10px;border:1px solid var(--line);margin:2px 0 12px}
    .opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1.5px solid #eee;
      border-radius:12px;margin:8px 0;cursor:pointer;transition:border-color .12s,background .12s}
    .opt:hover{border-color:var(--ring)}
    .opt.sel{border-color:var(--c);background:#f7f4ff}
    .opt input{width:auto;margin-top:3px;accent-color:var(--c)}
    .opt .k{font-weight:800;color:var(--c2)}

    .err{color:var(--bad);font-size:.85rem;margin-top:10px;font-weight:600}
    .pill{display:inline-block;padding:5px 14px;border-radius:999px;font-size:.78rem;font-weight:800}
    .pill.ok{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}
    .center{text-align:center}
    .big{font-size:3rem;font-weight:900;margin:.2rem 0;line-height:1}
    .spin{width:24px;height:24px;border:3px solid var(--ring);border-top-color:var(--c);
      border-radius:50%;animation:s .8s linear infinite;display:inline-block;vertical-align:middle}
    @keyframes s{to{transform:rotate(360deg)}}
    .muted{color:var(--soft);font-size:.85rem}
    .chip{display:inline-block;background:#ede9fe;color:var(--c2);font-weight:700;font-size:.72rem;
      padding:4px 10px;border-radius:999px;margin-bottom:6px}
    .barwrap{height:8px;background:#efeafe;border-radius:999px;overflow:hidden;margin:14px 0 4px}
    .bar{height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c));transition:width .25s}
    .ftr{text-align:center;color:#9b94b3;font-size:.72rem;margin-top:22px}
    .ftr a{color:var(--c2);text-decoration:none;font-weight:700}
    .ftr a:hover{text-decoration:underline}
    .ftr .links{margin-bottom:8px;font-size:.78rem}
    .ftr .sep{color:#cbc3e6;margin:0 8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <? if (logoUrl) { ?><img src="<?= logoUrl ?>" alt="Logo Kinta Utara" onerror="this.style.display='none'"><? } ?>
      <div class="org">PERSEKUTUAN PENGAKAP MALAYSIA</div>
      <div class="loc">Negeri Perak · Daerah Kinta Utara</div>
      <div class="rule"></div>
    </div>

    <div id="app" class="card"><div class="center"><span class="spin"></span></div></div>
    <div class="ftr">
      <div class="links">
        <a href="<?= appUrl ?>?page=guru">🔑 Log Masuk Guru</a>
        <span class="sep">·</span>
        <a href="<?= appUrl ?>?page=admin">Admin</a>
      </div>
      Sistem Kuiz Pengakap · Daerah Kinta Utara
    </div>
  </div>

<script>
var S = { quizId:'', namaProgram:'', schoolCode:'', participantId:'', nama:'', verify:'',
          attemptId:'', ambangLulus:80, questions:[], answers:{} };
var app = document.getElementById('app');

function call(fn, args, onOk, onErr, tries) {
  tries = tries || 0;
  google.script.run
    .withSuccessHandler(onOk)
    .withFailureHandler(function(e){
      if (tries < 2) { setTimeout(function(){ call(fn,args,onOk,onErr,tries+1); }, 800*(tries+1)); }
      else { (onErr||defaultErr)(e); }
    })[fn].apply(google.script.run, args);
}
function defaultErr(e){ render('<div class="err">Ralat: '+(e && e.message ? e.message : e)+'</div>'+backBtn('start')); }
function loading(msg){ render('<div class="center" style="padding:14px 0"><span class="spin"></span><div class="muted" style="margin-top:10px">'+(msg||'Memuatkan…')+'</div></div>'); }
function render(html){ app.innerHTML = html; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function backBtn(step){ return '<button class="ghost" onclick="go(\''+step+'\')">← Kembali</button>'; }
// Imej soalan. Server biasanya hantar data URI (base64) — papar terus.
// Kalau URL Drive (fallback), cuba thumbnail → lh3 → sembunyi.
function driveId(u){ var m=String(u||'').match(/[-\w]{25,}/); return m?m[0]:''; }
function qImg(u){
  u=String(u||'');
  if(u.indexOf('data:')===0){
    return '<img class="qimg" src="'+u+'" alt="" onerror="this.style.display=\'none\'">';
  }
  var id=driveId(u);
  var primary = id ? ('https://drive.google.com/thumbnail?id='+id+'&sz=w1000') : u;
  var alt = id ? ('https://lh3.googleusercontent.com/d/'+id) : '';
  return '<img class="qimg" src="'+esc(primary)+'" data-alt="'+esc(alt)+'" alt="" '+
    'onerror="if(this.dataset.alt&&this.src!==this.dataset.alt){this.src=this.dataset.alt;}else{this.style.display=\'none\';}">';
}

function go(step){ STEPS[step](); }

var STEPS = {
  start: function(){
    loading('Memuatkan program…');
    call('getActivePrograms', [], function(list){
      if (!list || !list.length) { render('<div class="err">Tiada kuiz aktif buat masa ini.</div>'); return; }
      var opts = list.map(function(p){ return '<option value="'+esc(p.quizId)+'">'+esc(p.namaProgram)+'</option>'; }).join('');
      render('<span class="chip">Langkah 1 / 4</span><h2 class="ttl">Selamat Datang</h2>'+
             '<p class="sub">Pilih program kuiz yang anda ingin sertai.</p>'+
             '<label>Program / Kuiz</label><select id="prog">'+opts+'</select>'+
             '<button onclick="chooseProg()">Seterusnya →</button>');
    });
  },
  school: function(){
    loading('Memuatkan sekolah…');
    call('getSchoolsForProgram', [S.quizId], function(list){
      if (!list || !list.length) { render('<div class="err">Tiada sekolah dengan peserta berdaftar untuk program ini.</div>'+backBtn('start')); return; }
      S.schoolList = list;
      var opts = list.map(function(s){ return '<option value="'+esc(s.name)+' ('+esc(s.schoolCode)+')"></option>'; }).join('');
      render('<span class="chip">Langkah 2 / 4</span><h2 class="ttl">'+esc(S.namaProgram)+'</h2>'+
             '<p class="sub">Taip & pilih nama sekolah anda. Kod sekolah dipapar untuk pengesahan.</p>'+
             '<label>Sekolah</label>'+
             '<input list="sks" id="sktext" autocomplete="off" placeholder="🔍 Taip nama sekolah…" oninput="showSkConfirm()">'+
             '<datalist id="sks">'+opts+'</datalist>'+
             '<div id="skconfirm" class="muted" style="margin-top:8px"></div>'+
             '<button onclick="chooseSchool()">Seterusnya →</button>'+backBtn('start'));
    });
  },
  name: function(){
    loading('Memuatkan senarai peserta…');
    call('getParticipants', [S.quizId, S.schoolCode], function(list){
      if (!list || !list.length) { render('<div class="err">Tiada peserta berdaftar dijumpai untuk sekolah ini.</div>'+backBtn('school')); return; }
      var opts = '<option value="">-- Pilih nama anda --</option>'+list.map(function(p){
        return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'; }).join('');
      render('<span class="chip">Langkah 3 / 4</span><h2 class="ttl">Pengesahan Peserta</h2>'+
             '<p class="sub">Hanya peserta berdaftar layak menjawab.</p>'+
             '<label>Nama Anda</label><select id="nm">'+opts+'</select>'+
             '<label>Sahkan Identiti — 4 aksara akhir No. IC / No. Pasport <br><span class="muted" style="font-weight:400">(atau masukkan No. Keahlian penuh, cth: AT3149-26)</span></label>'+
             '<input id="vf" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="cth: 1234 · 567A · AT3149-26" oninput="this.value=this.value.toUpperCase()">'+
             '<div id="nerr" class="err" style="display:none"></div>'+
             '<button onclick="verifyAndStart()">Mula Kuiz →</button>'+backBtn('school'));
    });
  },
  quiz: function(){
    var html = '<span class="chip">Langkah 4 / 4</span>'+
      '<h2 class="ttl">'+esc(S.namaProgram)+'</h2>'+
      '<p class="sub">'+esc(S.nama)+' · Lulus jika markah ≥ '+S.ambangLulus+'%</p>'+
      '<div class="barwrap"><div class="bar" id="bar"></div></div>'+
      '<div class="muted" id="prog2" style="margin-bottom:4px">Dijawab 0 / '+S.questions.length+'</div>';
    S.questions.forEach(function(q, idx){
      html += '<div class="q"><div class="t"><span class="n">'+(idx+1)+'</span>'+esc(q.soalan)+'</div>';
      if(q.gambar) html += qImg(q.gambar);
      q.options.forEach(function(o){
        html += '<label class="opt" id="o_'+q.id+'_'+o.key+'" onclick="pick(\''+q.id+'\',\''+o.key+'\')">'+
                '<input type="radio" name="'+q.id+'" '+(S.answers[q.id]===o.key?'checked':'')+'>'+
                '<span><span class="k">'+o.key+'.</span> '+esc(o.text)+'</span></label>';
      });
      html += '</div>';
    });
    html += '<div id="qerr" class="err" style="display:none"></div>'+
            '<button onclick="submitQuiz()">Hantar Jawapan</button>';
    render(html); updateProg();
  },
  result: function(r){
    var ok = r.passed;
    var html = '<div class="center">'+
      '<div class="chip">Keputusan</div>'+
      '<div style="font-weight:700;margin-top:4px">'+esc(S.nama)+'</div>'+
      '<div class="big" style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+r.peratus+'%</div>'+
      '<div class="muted">Markah: '+r.score+' / '+r.total+'</div>'+
      '<div style="margin:14px 0"><span class="pill '+(ok?'ok':'bad')+'">'+(ok?'✓ LULUS 🎉':'BELUM LULUS')+'</span></div>';
    if (ok) {
      html += '<button onclick="getCert()">📜 Claim Slip (PDF)</button>';
    } else {
      html += '<div class="muted">Perlu sekurang-kurangnya '+S.ambangLulus+'%. Jangan putus asa — cuba lagi!</div>'+
              '<button onclick="retryQuiz()">🔁 Cuba Lagi</button>';
    }
    html += '<div style="margin-top:10px">'+backBtn('start')+'</div></div>';
    render(html);
  }
};

function chooseProg(){
  var sel = document.getElementById('prog');
  S.quizId = sel.value; S.namaProgram = sel.options[sel.selectedIndex].text;
  go('school');
}
function _resolveSchool(){
  var el=document.getElementById('sktext'); var txt=el?el.value.trim():'';
  if(!txt) return null;
  var up=txt.toUpperCase(), found=null;
  (S.schoolList||[]).forEach(function(s){
    var label=(s.name+' ('+s.schoolCode+')');
    if(txt===label || up===String(s.name).toUpperCase() || up===String(s.schoolCode).toUpperCase()) found=s;
  });
  return found;
}
function showSkConfirm(){
  var c=document.getElementById('skconfirm'); if(!c) return;
  var s=_resolveSchool();
  c.innerHTML = s ? ('✅ <b>'+esc(s.name)+'</b> &middot; Kod: <b>'+esc(s.schoolCode)+'</b>')
                  : '<span style="color:#9b94b3">Pilih sekolah dari senarai…</span>';
}
function chooseSchool(){
  var s=_resolveSchool();
  if(!s){ alert('Sila pilih nama sekolah dari senarai.'); return; }
  S.schoolCode = s.schoolCode; S.schoolName = s.name; go('name');
}
function verifyAndStart(){
  var nm = document.getElementById('nm');
  S.participantId = nm.value;
  S.verify = document.getElementById('vf').value.trim();
  if (!S.participantId) { showErr('nerr','Sila pilih nama.'); return; }
  if (!S.verify) { showErr('nerr','Sila masukkan pengesahan.'); return; }
  loading('Mengesahkan & memuatkan soalan…');
  call('startAttempt', [S.quizId, S.participantId, S.schoolCode, S.verify], function(res){
    S.attemptId = res.attemptId; S.nama = res.nama; S.ambangLulus = res.ambangLulus;
    S.questions = res.questions; S.answers = {};
    go('quiz');
  }, function(e){ go('name'); setTimeout(function(){ showErr('nerr', e.message||'Pengesahan gagal.'); }, 50); });
}
function pick(qid, key){
  S.answers[qid] = key;
  S.questions.forEach(function(q){ if (q.id===qid){ q.options.forEach(function(o){
    var el=document.getElementById('o_'+qid+'_'+o.key); if (el) el.className='opt'+(o.key===key?' sel':'');
  }); }});
  updateProg();
}
function updateProg(){
  var done = Object.keys(S.answers).length, total = S.questions.length;
  var bar = document.getElementById('bar'); var p = document.getElementById('prog2');
  if (bar) bar.style.width = (total? Math.round(done/total*100):0) + '%';
  if (p) p.textContent = 'Dijawab ' + done + ' / ' + total;
}
function submitQuiz(){
  if (Object.keys(S.answers).length < S.questions.length) {
    showErr('qerr','Sila jawab semua soalan dahulu.'); return;
  }
  loading('Menyemak jawapan…');
  call('submitAttempt', [S.attemptId, S.answers], function(r){ STEPS.result(r); });
}
function retryQuiz(){
  loading('Menyediakan set soalan baharu…');
  call('startAttempt', [S.quizId, S.participantId, S.schoolCode, S.verify], function(res){
    S.attemptId = res.attemptId; S.questions = res.questions; S.answers = {};
    go('quiz');
  });
}
function getCert(){
  loading('Menjana slip…');
  call('claimCertificate', [S.quizId, S.participantId, S.verify], function(c){
    downloadB64(c.dataB64, c.filename, c.mimeType);
    render('<div class="center"><div class="big">✅</div><div style="font-weight:700">Slip dimuat turun.</div>'+
           '<div class="muted" style="margin-top:6px">Jika tidak bermula, semak fail muat turun anda.</div>'+
           '<button onclick="getCert()">Muat Turun Semula</button>'+backBtn('start')+'</div>');
  });
}
function downloadB64(b64, name, mime){
  var bytes = atob(b64); var arr = new Uint8Array(bytes.length);
  for (var i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
  var blob = new Blob([arr], { type: mime||'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=name||'slip.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function showErr(id,msg){ var el=document.getElementById(id); if(el){ el.textContent=msg; el.style.display='block'; } }

go('start');
</script>
</body>
</html>
