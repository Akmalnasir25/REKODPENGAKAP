<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QR Kehadiran</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #fff);
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
      text-align: center;
    }
    .subtitle {
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
      margin-bottom: 16px;
    }
    #video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #canvas { display: none; }
    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      height: 70%;
      border: 3px solid #10b981;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 12px;
    }
    .status.info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .status.success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .info-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-card h3 {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .info-row:last-child { border-bottom: 0; }
    .info-row .label { opacity: 0.7; }
    .info-row .value { font-weight: bold; }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #10b981;
      color: #fff;
    }
    .btn-primary:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .badge-tag {
      display: inline-block;
      background: rgba(245, 158, 11, 0.3);
      color: #fcd34d;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 Scan QR Kehadiran</h1>
    <div class="subtitle" id="program-label">Program: <span id="program-name">-</span></div>

    <div id="scanner-view">
      <div id="video-container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        <div class="scan-frame"></div>
      </div>
      <div class="status info" id="status">Halakan kamera ke QR sekolah...</div>
      <button class="btn-secondary" id="btn-cancel">Batal</button>
    </div>

    <div id="result-view" style="display:none;">
      <div class="info-card">
        <h3>✅ QR Berjaya Dibaca</h3>
        <div class="info-row"><span class="label">Sekolah:</span><span class="value" id="r-school">-</span></div>
        <div class="info-row"><span class="label">Kod:</span><span class="value" id="r-code">-</span></div>
        <div class="info-row"><span class="label">Program:</span><span class="value" id="r-badge">-</span></div>
        <div class="info-row"><span class="label">Tahun:</span><span class="value" id="r-year">-</span></div>
        <div class="info-row"><span class="label">Peserta:</span><span class="value" id="r-count">-</span></div>
      </div>
      <div class="status info" id="result-status">Klik untuk sahkan kehadiran.</div>
      <button class="btn-primary" id="btn-confirm">✅ Sahkan Kehadiran</button>
      <button class="btn-secondary" id="btn-rescan">🔄 Scan Semula</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // Get badge from URL
    const params = new URLSearchParams(window.location.search);
    const badgeName = params.get('badge') || '';
    const badgeId = params.get('badgeId') || '';
    const chatId = params.get('chatId') || '';
    const SCAN_ENDPOINT = 'https://jvjxeckzmokoqjfsuene.supabase.co/functions/v1/telegram-scan-record';
    document.getElementById('program-name').textContent = badgeName || '-';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const scannerView = document.getElementById('scanner-view');
    const resultView = document.getElementById('result-view');
    let stream = null;
    let scanned = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (type || 'info');
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        scanLoop();
      } catch (e) {
        setStatus('Gagal buka kamera: ' + (e.message || e), 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function scanLoop() {
      if (!stream || scanned) return;
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(scanLoop);
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code?.data) {
          handleQR(code.data);
          return;
        }
      } catch (e) { /* ignore */ }
      requestAnimationFrame(scanLoop);
    }

    function handleQR(qrText) {
      let parsed = null;
      try { parsed = JSON.parse(qrText); } catch (_) {}
      if (!parsed || !parsed.schoolCode || !parsed.badge) {
        setStatus('QR tidak sah. Cuba lagi.', 'error');
        setTimeout(() => setStatus('Halakan kamera ke QR sekolah...', 'info'), 2000);
        return;
      }
      // Validate badge match
      if (badgeName && parsed.badge !== badgeName) {
        setStatus(`QR untuk program "${parsed.badge}", bukan "${badgeName}".`, 'error');
        setTimeout(() => setStatus('Halakan kamera ke QR sekolah...', 'info'), 3000);
        return;
      }
      scanned = parsed;
      stopCamera();
      showResult(parsed);
    }

    function showResult(data) {
      document.getElementById('r-school').textContent = data.schoolName || '-';
      document.getElementById('r-code').textContent = data.schoolCode || '-';
      document.getElementById('r-badge').textContent = data.badge || '-';
      document.getElementById('r-year').textContent = data.year || new Date().getFullYear();
      document.getElementById('r-count').textContent = data.totalParticipants || 0;
      scannerView.style.display = 'none';
      resultView.style.display = 'block';
    }

    document.getElementById('btn-cancel').addEventListener('click', () => {
      stopCamera();
      if (tg) tg.close();
    });

    document.getElementById('btn-rescan').addEventListener('click', () => {
      scanned = null;
      resultView.style.display = 'none';
      scannerView.style.display = 'block';
      setStatus('Halakan kamera ke QR sekolah...', 'info');
      startCamera();
    });

    document.getElementById('btn-confirm').addEventListener('click', async () => {
      if (!scanned) return;
      const btn = document.getElementById('btn-confirm');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      try {
        const res = await fetch(SCAN_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chatId,
            schoolCode: scanned.schoolCode,
            schoolName: scanned.schoolName,
            badge: scanned.badge,
            badgeId,
            year: scanned.year || new Date().getFullYear(),
            totalParticipants: scanned.totalParticipants || 0,
          }),
        });
        const result = await res.json();
        if (result.status === 'success') {
          document.getElementById('result-status').textContent = '✅ Berjaya disimpan!';
          document.getElementById('result-status').className = 'status success';
          btn.textContent = '✅ Selesai';
          setTimeout(() => { if (tg) tg.close(); else window.close(); }, 1500);
        } else {
          document.getElementById('result-status').textContent = '❌ ' + (result.message || 'Gagal simpan');
          document.getElementById('result-status').className = 'status error';
          btn.disabled = false;
          btn.textContent = '🔄 Cuba Lagi';
        }
      } catch (e) {
        document.getElementById('result-status').textContent = '❌ Ralat sambungan: ' + e.message;
        document.getElementById('result-status').className = 'status error';
        btn.disabled = false;
        btn.textContent = '🔄 Cuba Lagi';
      }
    });

    // Start camera on load
    window.addEventListener('load', startCamera);
    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
